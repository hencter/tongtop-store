<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 305" width="354" height="305" role="img" aria-label="TongTop Store">
  <title>TongTop Store</title>
  <!--
    TongTop Store 品牌标 · 双窗口「T」
      前排：深蓝 #0B2E6E 的 T 形窗口（标题栏横梁 + 左下窗柱 + 三圆点）
      后排：浅蓝 #1E9BF0 的窗口边框（中空），右移 104 / 上移 53，露出顶栏、右栏与垂腿
    坐标原点 = 前排深蓝外形包围盒左上；整体外框 354 × 305。
    关键尺寸（单位 = 参考图像素，逐行实测）：
      前排横梁 (0,0)-(237,82)，圆角 22；窗柱 (84,82)-(158,250)，圆角 22；整体即字母 T
      后排外框 (104,-53)-(354,251)，圆角 56；内沿 (148,-9)-(310,207)，圆角 20（边框厚 44）
      后排一角的左/上部分被前排压住，只露出顶栏、右侧竖栏与下方的垂腿
      圆点：前排 3 枚（标题栏内），后排 3 枚（多数被前排压住，只最左一枚露出）
    说明：造型与比例按参考图定稿；参考图本身带柔光/抗锯齿与轻微竖向错切，
    本文件采用轴对齐的标准几何（实测错切会让蓝/白边界更差，故不引入）。
  -->
  <g fill="none">
    <!-- 后排窗口：中空边框（在最底层） -->
    <path
      fill="#1E9BF0"
      fill-rule="evenodd"
      d="M104 3A56 56 0 0 1 160 -53H298A56 56 0 0 1 354 3V195A56 56 0 0 1 298 251H160A56 56 0 0 1 104 195Z
         M148 11A20 20 0 0 1 168 -9H290A20 20 0 0 1 310 11V187A20 20 0 0 1 290 207H168A20 20 0 0 1 148 187Z"
    />
    <!-- 前排 T 形窗口（深蓝） -->
    <path
      fill="#0B2E6E"
      d="M0 22A22 22 0 0 1 22 0H215A22 22 0 0 1 237 22V60A22 22 0 0 1 215 82H158V228A22 22 0 0 1 136 250H106A22 22 0 0 1 84 228V82H22A22 22 0 0 1 0 60Z"
    />
  </g>
  <!-- 前排标题栏圆点（负空间） -->
  <g fill="#FFFFFF">
    <circle cx="27" cy="45" r="9"/>
    <circle cx="65" cy="47" r="9"/>
    <circle cx="103" cy="49" r="9"/>
  </g>
  <!-- 后排标题栏圆点（只最左一枚露在前排窗口之外） -->
  <g fill="#FFFFFF">
    <circle cx="150" cy="-8" r="8"/>
    <circle cx="180" cy="-6" r="8"/>
    <circle cx="210" cy="-4" r="8"/>
  </g>
</svg>
