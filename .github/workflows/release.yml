# Release：推 tag v*（或手动触发）→ Windows 构建 NSIS 安装包 → 发布 GitHub Release。
#
# 发布流程：
#   1. 三处版本号 bump 并保持一致：package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml
#      （CI 会校验，不一致直接失败 —— 防止再次出现 Cargo.toml 落后导致自更新误报）
#   2. git tag v0.x.x && git push --tags（或在 Actions 页手动 Run workflow 填版本号）
#   3. 自动产出：GitHub Release（安装包 asset）→ 商店内自更新即可检测到
#      （自更新拉取 tongtianlu/tongtop-store 的 latest release，tag 必须带 v 前缀）
#   4. winget 清单自动生成并作为 artifact 上传（winget-manifest），下载后本地执行：
#      winget validate --manifest <目录> && wingetcreate submit <目录>

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，如 0.4.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 解析 tag 并校验三处版本号一致
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ inputs.version }}"
          fi
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG package.json=$PKG tauri.conf=$CONF cargo=$CARGO"
          if [ "$TAG" != "v$PKG" ] || [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::版本号不一致：tag($TAG) / package.json($PKG) / tauri.conf.json($CONF) / Cargo.toml($CARGO)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        id: v

      - run: pnpm install --frozen-lockfile

      - name: 构建桌面端安装包（NSIS）
        run: pnpm tauri build

      - name: 复制固定名资产（自更新 latest slug 直链）+ 完整性摘要
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          cp tongtop-store_*_x64-setup.exe tongtop-store-setup.exe
          sha256sum tongtop-store-setup.exe > tongtop-store-setup.exe.sha256
          # 裸 exe：自更新不再走 NSIS（看门狗 Copy 覆盖），这是更新路径的主资产
          cp ../../tongtop-store.exe tongtop-store.exe
          sha256sum tongtop-store.exe > tongtop-store.exe.sha256
          ls -la

      - name: 生成 winget 清单
        run: node scripts/winget-bump.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: winget/TongTianLu.TongTopStore/
          retention-days: 30

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/tongtop-store.exe
            src-tauri/target/release/bundle/nsis/*.sha256
