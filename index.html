<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应用商店</title>
    <script>
      // 首帧前应用主题，避免暗色用户启动时白闪（与 src/state/themeStore.ts 逻辑一致）
      try {
        var t = localStorage.getItem("tongtop.theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.background = dark ? "#141417" : "#ffffff";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
